# Central check: reject data files and large files, then scan for secrets.
# Meant as an org ruleset workflow, so it runs in the TARGET repo.
# The target repo is checked out into "target" and this org repo into
# ".org-check", side by side. Both checks scan only "target", so the
# check's own files are never scanned and no exclude option is needed.
name: data-check

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  data-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: target
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/.github
          path: .org-check
          persist-credentials: false
      - run: python3 .org-check/data-check/check.py target
      # The two steps below run even when the data check fails, so both
      # results show. The job fails if either check fails.
      - name: Install gitleaks
        if: ${{ !cancelled() }}
        # To upgrade, change both: the sha256 is the linux_x64 line of the
        # release's gitleaks_<version>_checksums.txt.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks" && cd "$RUNNER_TEMP/gitleaks"
          curl -sSfL -O "$base/$tarball"
          echo "$GITLEAKS_SHA256  $tarball" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Secret scan
        if: ${{ !cancelled() }}
        run: sh .org-check/secret-scan/scan.sh target
